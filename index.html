<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A1815" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- SEO -->
    <title>NES Web Studio | Diseño web que convierte</title>
    <meta
      name="description"
      content="Diseño páginas web y landing pages para negocios, profesionales y marcas que quieren convertir visitas en clientes. Webs a medida, rápidas y pensadas para vender."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NES Web Studio" />
    <meta property="og:title" content="NES Web Studio | Diseño web que convierte" />
    <meta
      property="og:description"
      content="Diseño páginas web y landing pages para negocios, profesionales y marcas que quieren convertir visitas en clientes."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:locale" content="es_AR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NES Web Studio | Diseño web que convierte" />
    <meta
      name="twitter:description"
      content="Diseño páginas web y landing pages para negocios, profesionales y marcas que quieren convertir visitas en clientes."
    />
    <meta name="twitter:image" content="/og.png" />

    <!--
      Tipografías: Space Grotesk (títulos) + Inter (texto y UI).
      Son las fuentes de Google Fonts, self-hosteadas vía @fontsource
      (importadas en src/main.tsx): mejor performance y sin requests a terceros.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
